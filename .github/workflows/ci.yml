# Checks every push and pull request, then packages the extension so a reviewer can install the exact
# build that passed. The artifact is what you upload to Chrome; see .github/workflows/release.yml for
# tagged releases.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result; knowing it fails only on the floor is the useful part.
      fail-fast: false
      matrix:
        # The floor declared in package.json engines, pinned exactly, and the newest release line.
        node: ['24.0.0', '26']
    steps:
      # No token left in .git/config: `npm ci` runs dev-dependency install scripts, and nothing after the
      # checkout needs to talk to GitHub as this repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  package:
    name: Package extension
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build && npm run build:firefox

      - name: Read version
        id: meta
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Guards against shipping something Chrome would reject, or that works but leaks build detail. The
      # release workflow runs the same script before publishing, so the download and the artifact are held
      # to one standard.
      - name: Check the build is loadable
        run: npm run check:dist

      # Mozilla's validator, the same rules addons.mozilla.org applies on submission. Warnings fail too:
      # a warning marks a real gap, such as a minimum version that predates a declared feature.
      - name: Lint the Firefox build
        run: npm run lint:firefox

      # Downloading this artifact gives you a zip with manifest.json at its root: unzip it and load it
      # with "Load unpacked", or upload the zip itself to the Chrome Web Store dashboard.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shoutphish-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
          path: dist/
          if-no-files-found: error

      # Unsigned, so release Firefox loads it only as a temporary add-on from about:debugging.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shoutphish-firefox-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
          path: dist-firefox/
          if-no-files-found: error

  browsers:
    name: Browser smoke test
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The runner image ships stable Chrome, Edge and Firefox, so nothing is downloaded here. Named
      # explicitly so a browser missing from a future image fails the job instead of being skipped.
      - name: Load the extension and harness in each browser
        run: npm run smoke:browsers -- --browsers=chrome,edge,firefox

      # For a person to look at; nothing compares them, since fonts differ between machines.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-smoke-${{ github.sha }}
          path: smoke-output/
          if-no-files-found: warn

  # The one check the main-branch ruleset requires. The matrix jobs carry the Node version in their names,
  # so requiring them directly would leave the ruleset waiting for a check that no longer exists the next
  # time the floor moves. `always()` because a job skipped after a failed dependency counts as passing
  # to a required check; anything short of success here fails.
  passed:
    name: CI passed
    needs: [verify, package, browsers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
