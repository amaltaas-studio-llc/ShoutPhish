name: A phishing email was missed
description: ShoutPhish scored a phishing or scam email lower than it should have.
title: 'Missed phish: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting it. Please do not forward the email or paste it here: **this issue is
        public**, and phishing emails often contain links or codes tied to you. Describe what it did
        instead.

  - type: dropdown
    id: badge
    attributes:
      label: What did the badge say?
      options:
        - Low Risk
        - Caution
        - Suspicious
        - Not checked
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: What was the email pretending to be?
      description: >-
        For example "a parcel company asking for a redelivery fee" or "my manager asking me to buy gift
        cards". Naming a large, commonly imitated brand is fine; please do not name smaller organisations
        or people.
    validations:
      required: true

  - type: textarea
    id: tells
    attributes:
      label: What gave it away to you?
      description: >-
        The details that told you it was fake: an odd sender address, a link going somewhere unexpected, a
        strange attachment, an unusual request. Describe them; for an address, the pattern is enough, such
        as "the company name with an extra letter, at a different domain".
    validations:
      required: true

  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic report
      description: >-
        With the message open, click the ShoutPhish icon in the toolbar and choose **Copy a diagnostic
        report**, then paste it here. It contains no text from the message, but please read it first.
      render: text
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have not included the email itself, its links, or screenshots of it.
          required: true
