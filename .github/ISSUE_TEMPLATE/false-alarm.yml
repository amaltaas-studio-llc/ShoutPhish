name: A genuine email was flagged
description: ShoutPhish warned about an email that was real and expected.
title: 'False alarm: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. False alarms are the reports that matter most, because a checker that warns about
        ordinary mail gets switched off.

        **This issue is public.** Describe the email rather than pasting it, and leave out names,
        addresses, links and screenshots of the message.

  - type: dropdown
    id: badge
    attributes:
      label: What did the badge say?
      options:
        - Caution
        - Suspicious
        - High Risk
        - Low Risk, but the card said something that was wrong
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: What kind of email was it?
      description: >-
        The kind of message and who it was from, in general terms, for example "a delivery notice from a
        courier I use" or "an invoice from a regular supplier". Please do not name the organisation.
      placeholder: A password-reset email from a service I signed up to myself.
    validations:
      required: true

  - type: textarea
    id: wrong
    attributes:
      label: Which finding was wrong, and why?
      description: >-
        Paraphrase the finding the card showed and say why it does not apply. You can describe what the
        card quoted without copying it.
      placeholder: >-
        It said the sender's name refers to a brand the address does not belong to, but the email genuinely
        came from that company's own mail service.
    validations:
      required: true

  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic report
      description: >-
        With the message open, click the ShoutPhish icon in the toolbar and choose **Copy a diagnostic
        report**, then paste it here. It contains no text from the message, but please read it first.
      render: text
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have not included names, email addresses, links or screenshots from the real message.
          required: true
